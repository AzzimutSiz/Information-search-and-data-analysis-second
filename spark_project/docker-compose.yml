services:
  spark-master:
    build:
      context: .
    image: spark-project:1.0.0
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      SPARK_MASTER_HOST: spark-master

  spark-worker-1:
    image: spark-project:1.0.0
    pull_policy: never
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 512m
    depends_on:
      - spark-master

  spark-worker-2:
    image: spark-project:1.0.0
    pull_policy: never
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: 1
      SPARK_WORKER_MEMORY: 512m
    depends_on:
      - spark-master

  spark-api:
    image: spark-project:1.0.0
    pull_policy: never
    ports:
      - "8090:8090"
    depends_on:
      - spark-worker-1
      - spark-worker-2
